name: Refresh UAE places data

# The map is only worth having if it does not rot. This re-runs the scraper
# and commits the result only when something actually changed; the deploy
# workflow then picks it up and republishes.
on:
  schedule:
    - cron: '0 3 1 * *'      # 03:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Must be scrape:all, not scrape. The scraper rewrites places.js from
      # whatever providers ran, so an Overpass-only refresh would silently
      # delete every Firecrawl venue from the map.
      - name: Re-scrape both providers
        run: npm run scrape:all
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

      - name: Verify the site still passes with the new data
        run: |
          npm install --no-audit --no-fund
          npm test

      # Extraction is not deterministic: sources time out and retry, and a bad
      # run can return far fewer venues than the last one. Without this guard a
      # flaky scrape would quietly commit a gutted map and redeploy it.
      - name: Refuse a suspiciously small dataset
        run: |
          NEW=$(node -e "global.window={};require('./assets/data/places.js');console.log(window.MIBOWI_PLACES.places.length)")
          git stash -q --include-untracked -- assets/data/places.js || true
          OLD=$(node -e "global.window={};require('./assets/data/places.js');console.log(window.MIBOWI_PLACES.places.length)")
          git stash pop -q || true
          echo "previous: $OLD   new: $NEW"
          MIN=$(( OLD * 80 / 100 ))
          if [ "$NEW" -lt "$MIN" ]; then
            echo "::error::Refusing to commit: $NEW places is under 80% of the previous $OLD. Probably a flaky scrape — re-run the workflow."
            exit 1
          fi

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- assets/data/places.js; then
            echo "No change in the source data — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/places.js
          git commit -m "data: refresh UAE places from OpenStreetMap"
          git push
